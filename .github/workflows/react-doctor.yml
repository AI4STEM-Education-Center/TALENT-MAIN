name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a stable release — `@main` regressed on 2026-06-10 (#769
      # "consolidate scan scope into one --scope flag") with "too many
      # arguments. Expected 1 argument but got 2".
      - uses: millionco/react-doctor@v2.2.9
        # Every input below is stated explicitly: the v2.2.8 defaults are
        # version=latest, scope=changed, blocking=none, which silently drifts
        # from local runs and never fails the job. See
        # https://github.com/millionco/react-doctor/blob/v2.2.8/action.yml
        with:
          # Match the scanner used for local triage so CI and local scores are
          # comparable. Bump both together.
          version: "0.9.12"
          # Fail the PR on error-severity diagnostics. Warnings stay advisory —
          # `doctor.config.ts` and the inline suppressions in
          # `.react-doctor/false-positives.md` keep that signal meaningful.
          blocking: error
          # Score the whole project, not just PR-touched files, so the number in
          # the PR comment is the same one `npx react-doctor --scope full` prints.
          scope: full
