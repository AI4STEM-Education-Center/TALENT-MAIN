name: CI Validation

on:
  pull_request:
    branches: [dev]
  # Also run on dev pushes so the npm and Next.js build caches stay warm on the
  # base branch where every PR targeting dev can restore them.
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      # Persist Next.js's incremental build cache across CI runs so `next build`
      # reuses compiled output instead of recompiling everything from cold.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      # `next build` runs `tsc` against tsconfig.json (including src/ and test/
      # plus generated route types), so a separate `npm run typecheck` step is
      # redundant here (keep `npm run typecheck` in package.json for local use).
      - name: Build application
        run: npm run build

      - name: Build background worker
        run: npm run worker:build

  # Aggregate gate preserving the `validate` check name expected by branch
  # workflows and tooling.
  validate:
    name: validate
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify test and build jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI failed: test=${{ needs.test.result }}, build=${{ needs.build.result }}"
            exit 1
          fi
