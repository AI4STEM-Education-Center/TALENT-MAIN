name: CI Validation

on:
  push:
    branches: [dev]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai4stem-education-center/talent-main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      # Persist Next.js's incremental build cache across CI runs so `next build`
      # reuses compiled output instead of recompiling everything from cold. The
      # source-file hash lets Next reuse partial caches when only some files change.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build application
        run: npm run build

  # Runs in parallel with `validate` instead of after it: `next build` inside
  # the Dockerfile catches the same build failures, and the image is pushed
  # under an immutable dev-<sha> tag only. `dev-latest` is not retagged (and
  # nothing deploys) until `validate` passes, so a red build can never become
  # the tag EC2 pulls.
  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The BuildKit layer cache lives in GHCR (type=registry) rather than the
      # Actions cache: exporting to the Actions cache took ~1 min per build,
      # and two mode=max multistage scopes competing for the repo's 10 GB limit
      # caused periodic evictions and cold 7-minute builds. The prod cache ref
      # is a fallback because main is promoted from dev with an identical tree.
      # provenance is off: the attestation manifest turns the pushed image into
      # an index, slowing the export and complicating ghcr-cleanup.
      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-dev
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-dev,mode=max,image-manifest=true,oci-mediatypes=true

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [validate, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize deploys: with build and validate racing, two pushes in quick
    # succession could otherwise retag/deploy out of order. A queued deploy for
    # a newer push replaces the pending one.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Manifest-only retag (no image data moves): dev-latest is what
      # docker-compose.dev.yml pulls, and after this it only ever points at a
      # sha whose validate job passed.
      - name: Promote image to dev-latest
        run: >-
          docker buildx imagetools create
          --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}

      - name: Copy docker-compose.dev.yml to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/docker-compose.dev.yml"
          target: "~/app"
          strip_components: 1

      - name: Deploy dev container to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker network inspect edge >/dev/null 2>&1 || docker network create edge >/dev/null
            # Shared spool for the admin resource monitor — the prod stack
            # attaches the same external volume. Idempotent.
            docker volume create talent-resource-metrics >/dev/null
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
            docker compose -f docker-compose.dev.yml stop worker-dev
            # The web container applies the schema before starting Next.js.
            # --wait blocks until its health check passes; worker-dev is also
            # gated on that health, so neither it nor this seed can race db push.
            docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 150 --force-recreate --no-build
            docker exec talent-web-dev node prisma/seed-prebuilt.js
            # See deploy.yml for why this is more than `docker image prune -f`:
            # dev deploys on every push to dev, so this is the busiest producer
            # of superseded images on the box.
            docker container prune -f
            docker image prune -af --filter "until=168h"
            docker builder prune -f --filter "until=168h"
