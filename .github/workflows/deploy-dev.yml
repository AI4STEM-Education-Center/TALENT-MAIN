name: Build & Deploy (Dev)

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai4stem-education-center/talent-main

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}

      - name: Copy docker-compose.dev.yml to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/docker-compose.dev.yml"
          target: "~/app"
          strip_components: 1

      - name: Deploy dev container to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
            docker compose -f docker-compose.dev.yml up -d --force-recreate --no-build
            docker exec adaptive-learning-webapp-dev node prisma/seed-prebuilt.js
            # Reconcile the MaterialClass join table from legacy LearningMaterial.classId.
            # Idempotent (upsert) and the script waits for the schema migration to finish,
            # so it is safe to re-run. Fail the deploy loudly if it errors -- the first run
            # raced `db push` and failed silently, which is why the links were never created.
            docker exec adaptive-learning-webapp-dev node prisma/backfill-material-class.js \
              || { echo "::error::MaterialClass backfill failed"; exit 1; }
            docker image prune -f
