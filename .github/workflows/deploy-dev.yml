name: Deploy Dev & Critical API Check

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai4stem-education-center/talent-main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-dev
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-dev,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Copy dev compose file to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker/docker-compose.dev.yml
          target: ~/app
          strip_components: 1

      - name: Deploy dev containers
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/app
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker network inspect edge >/dev/null 2>&1 || docker network create edge >/dev/null
            docker volume create talent-resource-metrics >/dev/null
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
            docker compose -f docker-compose.dev.yml stop worker-dev
            docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 150 --force-recreate --no-build
            docker exec talent-web-dev node prisma/seed-prebuilt.js
            docker container prune -f
            docker image prune -af --filter "until=168h"
            docker builder prune -f --filter "until=168h"

      - name: Run critical live-site checks
        env:
          TEST_PROFILE: critical
          TARGET_URL: https://dev.ai4talent.org
          TARGET_ENVIRONMENT: dev
          RESULT_OUTPUT: pressure/.tmp/api/critical.json
          REQUIRE_RESULT_PUBLISH: "true"
          REQUIRED_RESULT_SINKS: dev
          DEV_TEST_STUDENT_LOGIN: ${{ secrets.DEV_TEST_STUDENT_LOGIN }}
          DEV_TEST_STUDENT_PASSWORD: ${{ secrets.DEV_TEST_STUDENT_PASSWORD }}
          DEV_TEST_TEACHER_LOGIN: ${{ secrets.DEV_TEST_TEACHER_LOGIN }}
          DEV_TEST_TEACHER_PASSWORD: ${{ secrets.DEV_TEST_TEACHER_PASSWORD }}
          DEV_TEST_ADMIN_LOGIN: ${{ secrets.DEV_TEST_ADMIN_LOGIN }}
          DEV_TEST_ADMIN_PASSWORD: ${{ secrets.DEV_TEST_ADMIN_PASSWORD }}
          DEV_RESULTS_URL: https://dev.ai4talent.org
          DEV_PRESSURE_RESULTS_TOKEN: ${{ secrets.DEV_PRESSURE_RESULTS_TOKEN }}
          PROD_RESULTS_URL: https://ai4talent.org
          PROD_PRESSURE_RESULTS_TOKEN: ${{ secrets.PROD_PRESSURE_RESULTS_TOKEN }}
        run: node pressure/api-test.mjs

      - name: Upload critical-check result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dev-critical-api-${{ github.sha }}
          path: pressure/.tmp/api/*.json
          if-no-files-found: warn
          retention-days: 30
