name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai4stem-education-center/talent-main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read release version
        id: version
        run: |
          echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          echo "release_date=$(node -p "require('./version.json').date")" >> "$GITHUB_OUTPUT"

      # ── Login to GitHub Container Registry ────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & Push Docker image ─────────────────────────────────────────
      # Layer cache lives in GHCR (type=registry) — see ci.yml's build-image
      # job for why. The dev cache ref matters here: main is promoted from dev
      # with an identical tree, so most layers hit the cache dev already built.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          build-args: |
            APP_ENV=prod
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_RELEASE_DATE=${{ steps.version.outputs.release_date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-prod
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-dev
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-prod,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Create git tag
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created ${tag}`);
            } catch (error) {
              if (error.status === 422) {
                core.info(`${tag} already exists; skipping`);
              } else {
                throw error;
              }
            }

      # ── Copy compose file to EC2 ──────────────────────────────────────────
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "~/app"
          strip_components: 1

      # ── Deploy to EC2 via SSH ─────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker network inspect edge >/dev/null 2>&1 || docker network create edge >/dev/null
            # Shared spool for the admin resource monitor, attached by both the
            # prod and dev stacks (docker-compose.yml declares it external).
            # Idempotent: a no-op once the volume exists.
            docker volume create talent-resource-metrics >/dev/null
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose stop worker
            # Wait for the web container to finish schema application and pass
            # health checks before the worker is allowed to start.
            docker compose up -d --wait --wait-timeout 150 --force-recreate --no-build
            # Reclaim disk. `docker image prune -f` only drops DANGLING images,
            # which left every superseded tagged image and every stopped
            # container's layers on a 20 GB root volume. -a plus an age filter
            # also clears images nothing is running any more, while keeping the
            # last week's so a rollback does not need a re-pull; images in use by
            # a running container (including the dev stack's) are never touched.
            docker container prune -f
            docker image prune -af --filter "until=168h"
            docker builder prune -f --filter "until=168h"
