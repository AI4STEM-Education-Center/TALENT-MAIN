# Dev stack. Runs alongside the production stack (docker-compose.yml) on one
# EC2 instance; see that file for why the log limits and the metrics spool are
# mirrored here.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Same external volume the prod stack attaches — see docker-compose.yml for why
# it is a named volume and not a bind mount.
volumes:
  resource-metrics:
    name: talent-resource-metrics
    external: true

services:
  web-dev:
    container_name: adaptive-learning-webapp-dev
    image: ghcr.io/ai4stem-education-center/talent-main:dev-latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: always
    ports:
      - "3001:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      APP_ENV: dev
      # Dev shares the bucket with prod but has a separate database. Namespace
      # its objects so either environment's GC can only see its own assets.
      S3_KEY_PREFIX: "dev/"
      DATABASE_URL: ${DEV_DATABASE_URL}
      # Same host directory the prod stack mounts — that shared mount is what
      # lets each site's System Resources tab chart all four nodes.
      RESOURCE_SPOOL_DIR: /app/metrics
    volumes:
      - ./data/db/dev:/app/prisma/data
      - resource-metrics:/app/metrics
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker-dev:
    container_name: adaptive-learning-webapp-worker-dev
    image: ghcr.io/ai4stem-education-center/talent-main:dev-latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    pull_policy: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      APP_ENV: dev
      S3_KEY_PREFIX: "dev/"
      DATABASE_URL: ${DEV_DATABASE_URL}
      RESOURCE_SPOOL_DIR: /app/metrics
    volumes:
      - ./data/db/dev:/app/prisma/data
      - resource-metrics:/app/metrics
    logging: *logging
    restart: unless-stopped
    depends_on:
      web-dev:
        condition: service_healthy
