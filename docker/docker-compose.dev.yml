services:
  web-dev:
    container_name: adaptive-learning-webapp-dev
    image: ghcr.io/ai4stem-education-center/talent-main:dev-latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: always
    ports:
      - "3001:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      APP_ENV: dev
      # Dev shares the bucket with prod but has a separate database. Namespace
      # its objects so either environment's GC can only see its own assets.
      S3_KEY_PREFIX: "dev/"
      DATABASE_URL: ${DEV_DATABASE_URL}
    volumes:
      - ./data/db/dev:/app/prisma/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker-dev:
    container_name: adaptive-learning-webapp-worker-dev
    image: ghcr.io/ai4stem-education-center/talent-main:dev-latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    pull_policy: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      APP_ENV: dev
      S3_KEY_PREFIX: "dev/"
      DATABASE_URL: ${DEV_DATABASE_URL}
    volumes:
      - ./data/db/dev:/app/prisma/data
    restart: unless-stopped
    depends_on:
      - web-dev
