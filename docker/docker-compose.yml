services:
  web:
    image: ghcr.io/ai4stem-education-center/talent-main:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: always
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${PROD_DATABASE_URL}
    volumes:
      - ./data/db/prod:/app/prisma/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker:
    image: ghcr.io/ai4stem-education-center/talent-main:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    pull_policy: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${PROD_DATABASE_URL}
    volumes:
      - ./data/db/prod:/app/prisma/data
    restart: unless-stopped
    depends_on:
      - web
