#cloud-config
# Cloud-init for the load generator.
#
# A SEPARATE INSTANCE, ON PURPOSE. The application is single-process and
# bottlenecked on one CPU: every Prisma query is a synchronous better-sqlite3
# call, bcryptjs is pure JS, and CloudFront URL signing is RSA on the same
# thread. Running k6 on the system under test would put the measurement tool in
# direct competition for exactly the resource being measured, and every reported
# capacity number would be too low by however much CPU k6 took. Same-AZ private
# networking keeps the network out of the measurement instead.
#
# This instance is plain Ubuntu — no AMI from production, so it never holds
# production data or credentials.

package_update: true

bootcmd:
  - [ sh, -c, "shutdown -h +300 'benchmark backstop' || true" ]

runcmd:
  - [ sh, -c, "mkdir -p /opt/bench /var/log/bench && chown -R ubuntu:ubuntu /opt/bench" ]
  - [ sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg jq unzip sqlite3 >> /var/log/bench/boot.log 2>&1" ]
  # Node, for the session minter, the AI stub and the report tooling.
  - [ sh, -c, "curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >> /var/log/bench/boot.log 2>&1" ]
  - [ sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs >> /var/log/bench/boot.log 2>&1" ]
  # k6 is installed by tools/install-k6.sh, which pins the version and verifies
  # the checksum — the same script CI uses, so both tiers measure with the same binary.
  - [ sh, -c, "chmod +x /opt/bench/install-k6.sh && /opt/bench/install-k6.sh --prefix /usr/local/bin >> /var/log/bench/boot.log 2>&1" ]
  - [ sh, -c, "touch /opt/bench/READY" ]
